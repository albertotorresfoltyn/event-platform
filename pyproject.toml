[project]
name = "event-platform"
version = "0.1.0"
description = "Distributed event processing platform: async ingestion, MongoDB storage, Elasticsearch search, Redis caching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests that require running infrastructure (MongoDB, Elasticsearch, Redis)"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/event_platform"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC", "PT", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["event_platform"]
plugins = ["pydantic.mypy"]
